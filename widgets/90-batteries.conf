local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('batteries')

-- The rings are drawn in Cairo by lua/batteries.lua, which runs after conky
-- has painted this card's own text. bin/batteries.py supplies the device list
-- and, via ${voffset}, reserves the vertical space the rings need -- that is
-- what lets the card resize itself as devices connect and disconnect.
conky.config.lua_load          = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/batteries.lua"
conky.config.lua_draw_hook_post = "batteries_draw"

conky.text = [[
${execpi 15 $HOME/.config/conky/gruvbox-dark/bin/batteries.py}]]
