local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('nowplaying')

-- Art, text and progress bar are drawn in Cairo by lua/nowplaying.lua;
-- bin/nowplaying.py supplies the track from MPRIS and reserves the space.
-- The 1 s interval is what keeps the progress bar and elapsed time moving.
conky.config.lua_load           = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/nowplaying.lua"
conky.config.lua_draw_hook_post = "nowplaying_draw"

conky.text = [[
${execpi 1 $HOME/.config/conky/gruvbox-dark/bin/nowplaying.py}]]
