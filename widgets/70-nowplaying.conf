local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('nowplaying')

-- Art, text and progress bar are drawn in Cairo by lua/nowplaying.lua;
-- bin/nowplaying.py supplies the track from MPRIS and reserves the space.
-- The script runs every 3 s while a player is open, which is how long a track
-- change can take to show, and not at all while none is (lua/exec.lua, keyed
-- on the players by lua/nowplaying.lua). The progress bar and elapsed time are
-- run on between those runs by lua/nowplaying.lua, which conky still redraws
-- every second.
conky.config.lua_load           = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/nowplaying.lua"
conky.config.lua_draw_hook_post = "nowplaying_draw"

conky.text = [[
${lua_parse cached_exec 3 ]] .. os.getenv("HOME") .. [[/.config/conky/gruvbox-dark/bin/nowplaying.py}]]
