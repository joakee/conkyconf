local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('fuel')
-- Fuel prices from FuelWatch WA's public RSS feed: statewide average, then the
-- cheapest Perth metro sites. Click the fuel label in the header to change
-- fuel type: see lua/fuel.lua.
conky.config.lua_load       = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/fuel.lua"
conky.config.lua_mouse_hook = "fuel_mouse"
-- bin/fuel.py owns its own per-fuel cache (prices change once a day at 06:00)
-- and refreshes in the background, so this interval is only how often conky
-- re-renders it. It is every second so a click on the label shows at once; a
-- cache-only render costs ~30 ms.
conky.text = [[
${execpi 1 $HOME/.config/conky/gruvbox-dark/bin/fuel.py}]]
