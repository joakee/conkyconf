local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('fuel')
-- Unleaded 91 from FuelWatch WA's public RSS feed: statewide average, then the
-- cheapest sites. bin/fuel.py owns its own cache (prices change once a day at
-- 06:00) and refreshes in the background, so this interval is only how often
-- conky re-renders it.
conky.text = [[
${execpi 60 $HOME/.config/conky/gruvbox-dark/bin/fuel.py}]]
