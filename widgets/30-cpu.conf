local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('cpu')

-- One bar per core, laid out for however many this machine has. Counted from
-- /proc/stat because that is where conky's ${cpu cpuN} reads them, and asking
-- for a core it cannot see is fatal: the card exits on its first update.
local function cores()
  local n, fh = 0, io.open('/proc/stat')
  if fh then
    for line in fh:lines() do
      if line:match('^cpu%d') then n = n + 1 end
    end
    fh:close()
  end
  return math.max(n, 1)
end

-- Four to a row as before, eight once that would mean more than two rows.
-- Bars shrink to fit the row, and to make room for two-digit labels, but never
-- grow past the width they were designed at.
local n     = cores()
local cols  = (n <= 8) and 4 or 8
local GAP   = 6                        -- ${offset} between cells
local DIGIT = 8                        -- label glyph width, with a little slack
local label = #tostring(n) * DIGIT
local bar   = math.min(58, math.floor((w.WIDTH - (cols - 1) * GAP) / cols) - label)

local rows, row = {}, {}
for i = 1, n do
  row[#row + 1] = string.format('${color5}%d${color4}${cpubar cpu%d 6,%d}', i, i, bar)
  if #row == cols or i == n then
    rows[#rows + 1] = table.concat(row, '${offset ' .. GAP .. '}')
    row = {}
  end
end

conky.text = [[
${color1}${font Maple Mono NF CN:size=10}󰻠${font}  ${color5}${font Maple Mono NF CN:size=8}PROCESSOR${font}
${voffset 2}${color3}${font Maple Mono NF CN:bold:size=15}${cpu cpu0}%${font}${color5}${offset 8}${voffset -4}${freq_g} GHz${alignr}${color3}${hwmon 3 temp 1}°C${voffset 4}
${voffset 2}${color5}${font Maple Mono NF CN:size=8}${execi 86400 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//; s/(R)//g; s/(TM)//g; s/ @.*//'}${font}
${voffset 4}]] .. table.concat(rows, '\n')
