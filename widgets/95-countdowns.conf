local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('countdowns')

-- The list is edited in the Countdowns GTK app (~/.local/bin/countdowns);
-- bin/countdowns.py renders whatever it has saved. Click the card to open it.
-- 1 s interval keeps the seconds live; the card is `auto` because it grows
-- with the number of countdowns shown.
conky.config.lua_load       = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/countdowns.lua"
conky.config.lua_mouse_hook = "countdowns_mouse"

conky.text = [[
${execpi 1 $HOME/.config/conky/gruvbox-dark/bin/countdowns.py}]]
