local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('countdowns')

-- The list is edited in the Countdowns GTK app (~/.local/bin/countdowns);
-- bin/countdowns.py renders whatever it has saved. Click the card to open it.
-- The script runs when the app saves a change, and otherwise once a minute
-- (lua/exec.lua, keyed on the file by lua/countdowns.lua); the seconds are
-- kept live by lua/countdowns.lua, which conky calls every update.
-- The card is `auto` because it grows with the number of countdowns shown.
conky.config.lua_load       = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/countdowns.lua"
conky.config.lua_mouse_hook = "countdowns_mouse"
-- Conky 1.25 makes the card click-through; this undoes it (lua/clickable.lua).
conky.config.lua_draw_hook_pre = "clickable countdowns"

conky.text = [[
${lua_parse cached_exec 60 ]] .. os.getenv("HOME") .. [[/.config/conky/gruvbox-dark/bin/countdowns.py}]]
