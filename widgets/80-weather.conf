local w = dofile(os.getenv("HOME") .. "/.config/conky/gruvbox-dark/widget-common.lua")
conky.config = w.card('weather')
-- Click the refresh icon to fetch now: see lua/weather.lua.
conky.config.lua_load       = os.getenv("HOME") .. "/.config/conky/gruvbox-dark/lua/weather.lua"
conky.config.lua_mouse_hook = "weather_mouse"
-- The 24 h temperature/rain graphs, drawn over the space the script reserves.
conky.config.lua_draw_hook_post = "weather_draw"
-- The body is rendered by bin/weather.py (execpi = conky parses its output, so
-- the script can emit ${color}/${font}/${alignr} markup). Data comes from the
-- Bureau of Meteorology's public observation and precis products; the script
-- owns its own 15 min network cache, so this interval is only how often conky
-- asks it to re-render (which also re-derives the sun times locally). Every
-- 30 s, through lua/exec.lua rather than execpi: a render is a fresh Python,
-- ~60 ms of CPU, too much to spend every second on a card that changes every
-- few minutes. A click on the refresh icon renders every second for a while,
-- so its refreshing/failed icon and the fresh reading still show up at once.
conky.text = [[
${lua_parse cached_exec 30 ]] .. os.getenv("HOME") .. [[/.config/conky/gruvbox-dark/bin/weather.py}]]
