--[[
  gruvbox-dark  --  a conky theme
  font:    Maple Mono NF CN  (Nerd Font glyphs required)
  palette: gruvbox dark (hard background)

  run:  conky -c ~/.config/conky/gruvbox-dark/gruvbox-dark.conf
--]]

conky.config = {

    -- ── palette ────────────────────────────────────────────────
    -- gruvbox dark
    --   bg0_h 1d2021   bg0 282828   bg1 3c3836   bg2 504945
    --   bg3   665c54   bg4 7c6f64   gray 928374
    --   fg0   fbf1c7   fg1 ebdbb2   fg2  d5c4a1   fg3 bdae93   fg4 a89984
    default_color        = 'ebdbb2',  -- fg1   body text
    color0               = 'fbf1c7',  -- fg0   headings
    color1               = 'fe8019',  -- orange  section accent
    color2               = '8ec07c',  -- aqua    values / good
    color3               = 'fabd2f',  -- yellow  numbers
    color4               = '83a598',  -- blue    bars
    color5               = '928374',  -- gray    labels
    color6               = 'b8bb26',  -- green   ok
    color7               = 'fb4934',  -- red     warn
    color8               = '504945',  -- bg2     rules / separators
    color9               = 'd3869b',  -- purple  misc

    default_shade_color  = '1d2021',
    default_outline_color= '1d2021',

    -- ── window ─────────────────────────────────────────────────
    own_window           = true,
    own_window_type      = 'normal',
    own_window_class     = 'conky',  -- lowercase: matches the existing picom shadow-exclude
    own_window_title     = 'conky-gruvbox-dark',
    own_window_hints     = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value  = 165,     -- 0 = fully transparent, 255 = opaque
    own_window_colour      = '1d2021',-- gruvbox bg0_h

    -- ── placement ──────────────────────────────────────────────
    alignment            = 'top_right',
    xinerama_head        = 0,         -- Xinerama head index: 0 = eDP-1, 1 = DP-2
    gap_x                = 28,
    gap_y                = 34,
    minimum_width        = 320,
    maximum_width        = 320,
    border_inner_margin  = 14,
    border_outer_margin  = 0,
    alignment_margin     = 0,

    -- ── text ───────────────────────────────────────────────────
    use_xft              = true,
    font                 = 'Maple Mono NF CN:size=9',
    xftalpha             = 1.0,
    override_utf8_locale = true,
    draw_shades          = false,
    draw_outline         = false,
    draw_borders         = false,
    uppercase            = false,
    use_spacer           = 'none',
    short_units          = true,
    pad_percents         = 2,
    top_name_width       = 14,
    format_human_readable= true,

    -- ── bars / graphs ──────────────────────────────────────────
    draw_graph_borders   = false,
    default_bar_width    = 292,
    default_bar_height   = 5,
    default_graph_width  = 292,
    default_graph_height = 30,

    -- ── behaviour ──────────────────────────────────────────────
    background           = true,
    double_buffer        = true,
    update_interval      = 1.0,
    total_run_times      = 0,
    no_buffers           = true,
    cpu_avg_samples      = 2,
    net_avg_samples      = 2,
    diskio_avg_samples   = 2,
    temperature_unit     = 'celsius',
    out_to_console       = false,
    extra_newline        = false,
}

conky.text = [[
${font Maple Mono NF CN:bold:size=30}${color0}${alignc}${time %H:%M}${font}
${voffset -4}${color5}${font Maple Mono NF CN:size=8}${alignc}${time %A  ·  %d %B %Y}${font}
${voffset 6}${color1}${font Maple Mono NF CN:size=11}󰣇${font}  ${color0}${nodename}${alignr}${color5}${execi 86400 awk -F= '/^PRETTY_NAME/{gsub(/"/,"",$2); print $2}' /etc/os-release}
${color5}kernel${alignr}${color2}${kernel}
${color5}uptime${alignr}${color2}${uptime}
${color5}packages${alignr}${color2}${execi 900 pacman -Qq | wc -l} pkgs

${color1}${font Maple Mono NF CN:size=10}󰻠${font}  ${color0}PROCESSOR${offset 6}${color8}${hr 1}
${voffset 2}${color5}${execi 86400 grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//; s/(R)//g; s/(TM)//g; s/ @.*//'}
${color3}${font Maple Mono NF CN:bold:size=14}${cpu cpu0}%${font}${color5}${offset 8}${voffset -4}${freq_g} GHz${alignr}${color3}${hwmon 3 temp 1}°C${voffset 4}
${voffset 2}${color5}1${color4}${cpubar cpu1 6,58}${offset 6}${color5}2${color4}${cpubar cpu2 6,58}${offset 6}${color5}3${color4}${cpubar cpu3 6,58}${offset 6}${color5}4${color4}${cpubar cpu4 6,58}
${color5}5${color4}${cpubar cpu5 6,58}${offset 6}${color5}6${color4}${cpubar cpu6 6,58}${offset 6}${color5}7${color4}${cpubar cpu7 6,58}${offset 6}${color5}8${color4}${cpubar cpu8 6,58}

${color1}${font Maple Mono NF CN:size=10}󰍛${font}  ${color0}MEMORY${offset 6}${color8}${hr 1}
${voffset 2}${color2}${mem}${color5} / ${memmax}${alignr}${color3}${memperc}%
${voffset 2}${color4}${membar}
${voffset 4}${color5}swap${offset 8}${color2}${swap}${color5} / ${swapmax}${alignr}${color3}${swapperc}%
${voffset 2}${color9}${swapbar 5,292}

${color1}${font Maple Mono NF CN:size=10}󰋊${font}  ${color0}STORAGE${offset 6}${color8}${hr 1}
${voffset 2}${color5}/${alignr}${color2}${fs_used /}${color5} / ${fs_size /}${offset 8}${color3}${fs_used_perc /}%
${voffset 2}${color4}${fs_bar /}
${voffset 4}${color5}nvme0n1${offset 8}${color2}󰛢 ${diskio_read nvme0n1}${alignr}${color2}󰛄 ${diskio_write nvme0n1}

${color1}${font Maple Mono NF CN:size=10}󰤨${font}  ${color0}NETWORK${offset 6}${color8}${hr 1}
${if_up wlan0}${voffset 2}${color5}ssid${alignr}${color2}${wireless_essid wlan0}
${color5}addr${alignr}${color2}${addr wlan0}
${color5}signal${offset 8}${color3}${wireless_link_qual_perc wlan0}%${alignr}${color4}${wireless_link_bar 4,150}
${voffset 4}${color2}󰇚 ${downspeed wlan0}${alignr}${color1}󰕒 ${upspeed wlan0}
${voffset 2}${color5}total${offset 8}${color2}${totaldown wlan0}${alignr}${color1}${totalup wlan0}${else}${voffset 2}${color7}wlan0 down${endif}${if_up tailscale0}
${color5}tailscale${alignr}${color9}${addr tailscale0}${endif}

${color1}${font Maple Mono NF CN:size=10}󰁹${font}  ${color0}POWER${offset 6}${color8}${hr 1}
${voffset 2}${color5}${battery_status BAT0}${alignr}${color3}${battery_percent BAT0}%
${voffset 2}${if_match ${battery_percent BAT0} < 20}${color7}${else}${color6}${endif}${battery_bar}
${voffset 4}${color5}remaining${alignr}${color2}${battery_time BAT0}
]]
